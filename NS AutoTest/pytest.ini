[pytest]
testpaths = testcases
addopts = -v --tb=short --strict-markers --html=reports/html/report.html --self-contained-html
markers =
    system: 系统基础测试
    user: 用户管理测试
    network: 网络功能测试
    disk: 磁盘I/O测试
    security: 安全功能测试
    performance: 性能测试
    slow: 耗时较长的测试
    smoke: 冒烟测试
timeout = 300
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
minversion = 7.0
